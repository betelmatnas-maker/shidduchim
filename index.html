<style>
/* Layout: office ledger — quiet header with live counts, tab strip, one working surface per tab; separate A4 print card */
:root{

  --gold:#9a6f17; --gold-soft:#f5ecd6;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#19202a; --ink:#e5e9ef; --muted:#9aa4b4; --line:#2a3340;
  --accent:#74abd8; --accent-ink:#0d1620; --accent-soft:#1c3246;
  --gold:#d8ae57; --gold-soft:#33291a;
  --ok:#62c08a; --ok-soft:#18311f; --bad:#e47c7c; --bad-soft:#3a1d1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#19202a; --ink:#e5e9ef; --muted:#9aa4b4; --line:#2a3340;
  --accent:#74abd8; --accent-ink:#0d1620; --accent-soft:#1c3246;
  --gold:#d8ae57; --gold-soft:#33291a;
  --ok:#62c08a; --ok-soft:#18311f; --bad:#e47c7c; --bad-soft:#3a1d1e; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.2} h2{font-size:1.4rem} h3{font-size:1.1rem}
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;padding-block:20px 16px}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:12px 0;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.grow{flex:1 1 200px;min-width:0}

textarea{min-height:84px;resize:vertical}
label{font-weight:600}
.btn{appearance:none;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}

.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:right;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}

.field .help{font-size:.85rem;color:var(--muted);font-weight:400}
.req{color:var(--bad)}

.field.err input,.field.err select,.field.err textarea{border-color:var(--bad)}

.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;flex-wrap:wrap;align-items:center;z-index:5}

.dphoto{width:130px;height:165px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.dl{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:8px 16px;margin:0}
.dl dt{color:var(--muted);font-size:.92rem}
.dl dd{margin:0;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}

.dpart{font-family:var(--display);color:var(--accent);font-size:1.25rem;margin-top:8px}
.chk{display:flex;gap:6px;align-items:center;font-weight:400}
.printbox{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:10px 14px}

.mlist{display:flex;flex-direction:column;gap:10px}

@media (max-width:600px){.mitem{grid-template-columns:60px 1fr}.mitem .act{grid-column:1/-1}}
.score{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);text-align:center;line-height:1}

.pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:10px;min-width:0}

.prop{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.prop textarea{min-height:56px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.lerr{color:var(--bad);font-weight:600;margin:0;min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s}}

/* ---------- print card (A4) ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}

.pp{font-family:var(--body);color:#1b2230;background:#fff;direction:rtl;font-size:10.5pt;line-height:1.45}

.pp-dl{display:grid;grid-template-columns:40mm 1fr;gap:2px 10px;margin:0}
.pp-dl dt{color:#5b6576} .pp-dl dd{margin:0;white-space:pre-wrap}
.pp-foot{margin-top:12px;font-size:8.5pt;color:#888;border-top:1px solid #e3e6ea;padding-top:5px}
</style>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
function age(bd){if(!bd)return null;const d=new Date(bd);if(isNaN(d))return null;const n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a>=0&&a<130?a:null}
const fullName=c=>c?((c.firstName||'')+' '+(c.lastName||'')).trim()||'ללא שם':'(נמחק)';
const msWord=c=>{const m=MST[c?.maritalStatus||'single'];return c?.gender==='m'?m[0]:c?.gender==='f'?m[1]:m[2]};
const fmtDate=s=>{if(!s)return'';const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('he-IL')};
const fmtVal=v=>Array.isArray(v)?v.join(', '):(v??'');
const empty=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3400)}
function errMsg(e){const c=String(e&&e.code||''),m=String(e&&e.message||'');
  if(c==='23505')return'הצעה כזאת כבר קיימת במערכת.';
  if(/column .*photo/i.test(m))return'שמירת תמונות עדיין לא הופעלה במסד הנתונים. יש להריץ את עדכון ה-SQL.';
  if(c==='42501'||/row-level security|permission/i.test(m))return'אין לך הרשאה לפעולה זו.';
  if(/fetch|network/i.test(m))return'אין חיבור לאינטרנט. בדקו את החיבור ונסו שוב.';
  if(/JWT|session/i.test(m))return'פג תוקף הכניסה. יש לרענן את הדף ולהיכנס מחדש.';
  if(/too large|payload/i.test(m))return'התמונה גדולה מדי. נסו תמונה אחרת.';
  return'השמירה נכשלה. נסו שוב בעוד רגע.'}
async function write(fn,ok){if(!S.db){toast('אין חיבור למאגר.',true);return false}
  try{const r=await fn();if(r&&r.error)throw r.error;if(ok)toast(ok);return (r&&r.data)||true}catch(e){console.error(e);toast(errMsg(e),true);return false}}
const nz=v=>v===''||v==null?null:v;
const fromC=r=>({firstName:r.first_name,lastName:r.last_name,gender:r.gender,maritalStatus:r.marital_status,children:r.children,birthDate:r.birth_date,phone:r.phone,ageMin:r.age_min,ageMax:r.age_max,status:r.status,filledBy:r.filled_by,notes:r.notes,answers:r.answers||{},createdAt:r.created_at,updatedAt:r.updated_at});
const toC=c=>({first_name:c.firstName,last_name:c.lastName,gender:c.gender,marital_status:c.maritalStatus||'single',children:nz(c.children),birth_date:nz(c.birthDate),phone:nz(c.phone),age_min:nz(c.ageMin),age_max:nz(c.ageMax),status:c.status,filled_by:c.filledBy,notes:nz(c.notes),answers:c.answers||{}});
const fromP=r=>({m:r.male_id,f:r.female_id,status:r.status,notes:r.notes||'',history:r.history||[],createdAt:r.created_at,updatedAt:r.updated_at});

/* display value of one field for a candidate ('' = nothing to show) */
function dispVal(f,c){
  switch(f.type){
    case'text':return c[f.id]||'';
    case'gender':return c.gender==='m'?'מועמד':c.gender==='f'?'מועמדת':'';
    case'birth':{const a=age(c.birthDate);return c.birthDate?fmtDate(c.birthDate)+(a!=null?` (גיל ${a})`:''):''}
    case'marital':return msWord(c);
    case'kids':return (c.maritalStatus&&c.maritalStatus!=='single'&&c.children!=null)?String(c.children):'';
    case'agerange':return (c.ageMin||c.ageMax)?`${c.ageMin||'?'}–${c.ageMax||'?'}`:'';
    case'phone':return f.base?(c.phone||''):(c.answers?.[f.id]||'');
    case'photo':case'status':case'filledby':case'notes':return'';
    default:return fmtVal(c.answers?.[f.id])}}

/* ---------- stats, tabs, render ---------- */
function renderStats(){const cs=Object.values(S.cands),ps=Object.values(S.props);
  const act=c=>c.status!=='engaged'&&c.status!=='paused';
  const m=cs.filter(c=>c.gender==='m'&&act(c)).length,f=cs.filter(c=>c.gender==='f'&&act(c)).length;
  const open=ps.filter(p=>['proposed','checking','met'].includes(p.status)).length,mz=ps.filter(p=>p.status==='mazal').length;
  $('#stats').innerHTML=`<div class="stat"><b>${m}</b><span>מועמדים פעילים</span></div><div class="stat"><b>${f}</b><span>מועמדות פעילות</span></div><div class="stat"><b>${open}</b><span>הצעות פתוחות</span></div><div class="stat gold"><b>${mz}</b><span>מזל טוב</span></div>`}
function setTab(t){S.tab=t;S.confirm=null;if(t!=='cands')S.sel=null;if(t==='form'&&!S.edit)S.photoDraft=undefined;window.scrollTo(0,0);render()}
function render(){renderStats();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  $('#main').innerHTML=!S.ready?`<div class="empty"><h3>טוען את המאגר…</h3></div>`:({cands:viewCands,form:viewForm,match:viewMatch,props:viewProps})[S.tab]();
  if(S.tab==='cands'&&!S.sel)renderList();
  if(S.tab==='form')afterForm();
  if(S.tab==='cands'&&S.sel)ensurePhoto(S.sel).then(changed=>{if(changed&&S.tab==='cands'&&S.sel)render()})}

/* ---------- candidates list ---------- */
function highlights(c){return[c.answers?.q_city,c.answers?.q_religious].filter(Boolean).map(esc).join(' · ')}
function viewCands(){if(S.sel)return viewDetail(S.sel);const f=S.f;
  return `<div class="row between"><h2>מועמדים</h2><button class="btn primary" data-act="new">מועמד/ת חדש/ה</button></div>
  <div class="row">
    <div class="grow"><input type="search" id="f-q" placeholder="חיפוש לפי שם, עיר או כל פרט אחר" value="${esc(f.q)}" aria-label="חיפוש"></div>
    <select id="f-g" aria-label="סינון לפי מין" style="width:auto"><option value="">מועמדים ומועמדות</option><option value="m" ${f.g==='m'?'selected':''}>מועמדים</option><option value="f" ${f.g==='f'?'selected':''}>מועמדות</option></select>
    <select id="f-ms" aria-label="סינון לפי מצב משפחתי" style="width:auto"><option value="">כל מצב משפחתי</option>${Object.entries(MST).map(([k,v])=>`<option value="${k}" ${f.ms===k?'selected':''}>${v[2]}</option>`).join('')}</select>
    <select id="f-st" aria-label="סינון לפי סטטוס" style="width:auto"><option value="">כל הסטטוסים</option>${Object.entries(CST).map(([k,v])=>`<option value="${k}" ${f.st===k?'selected':''}>${v}</option>`).join('')}</select>
  </div><div id="list"></div>`}
function renderList(){const el=$('#list');if(!el)return;const f=S.f;let cs=Object.entries(S.cands);
  if(!cs.length){el.innerHTML=`<div class="empty"><h3>עדיין אין מועמדים במאגר</h3><p>כל מועמד ומועמדת שיירשמו יופיעו כאן ככרטיס, עם גיל, עיר וסטטוס.</p><button class="btn primary" data-act="new">הוספת המועמד הראשון</button></div>`;return}
  const term=f.q.trim();
  cs=cs.filter(([,c])=>(!f.g||c.gender===f.g)&&(!f.ms||(c.maritalStatus||'single')===f.ms)&&(!f.st||c.status===f.st)&&(!term||(fullName(c)+' '+(c.phone||'')+' '+Object.values(c.answers||{}).map(fmtVal).join(' ')).includes(term)));
  cs.sort((a,b)=>(b[1].updatedAt||'').localeCompare(a[1].updatedAt||''));
  if(!cs.length){el.innerHTML=`<div class="empty"><p>לא נמצאו מועמדים התואמים לחיפוש.</p></div>`;return}
  el.innerHTML=`<div class="cards">${cs.map(([id,c])=>{const a=age(c.birthDate),h=highlights(c);return `<button class="card" data-act="open" data-id="${id}">
    <div class="row between"><span class="g-${c.gender}">${msWord(c)}${c.children&&c.maritalStatus!=='single'?' · '+c.children+' ילדים':''}</span><span class="pill ${c.status}">${CST[c.status]||''}</span></div>
    <div class="nm">${esc(fullName(c))}</div>
    <div class="meta">${a!=null?'גיל '+a:''}${a!=null&&h?' · ':''}${h}</div></button>`}).join('')}</div>
    <p class="muted small">${cs.length} מועמדים מוצגים</p>`}

/* ---------- candidate detail ---------- */
async function ensurePhoto(id){if(id in S.photos||!S.db)return false;S.photos[id]='';
  const {data,error}=await S.db.from('candidates').select('photo').eq('id',id).maybeSingle();
  if(!error&&data&&data.photo){S.photos[id]=data.photo;return true}return false}

  const a=age(c.birthDate),ph=S.photos[id];
  const parts=PARTS.filter(p=>!p.office).map(p=>{const secs=p.sections.map(s=>{const rows=s.fields.filter(f=>!['text','gender','photo'].includes(f.type)).map(f=>{const v=dispVal(f,c);return v?`<dt>${esc(f.label)}</dt><dd>${esc(v)}</dd>`:''}).join('');
      return rows?`<div class="panel"><h3 style="margin-bottom:12px">${esc(s.title)}</h3><dl class="dl">${rows}</dl></div>`:''}).join('');

  <div class="panel" style="display:flex;flex-direction:column;gap:16px">
    <div class="dhead">${ph?`<img class="dphoto" src="${ph}" alt="תמונת ${esc(fullName(c))}">`:''}
      <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px">

        <h2>${esc(fullName(c))}</h2>
        <div class="muted">${a!=null?'גיל '+a:''}${highlights(c)?' · '+highlights(c):''}</div>
        <div class="muted small">${c.filledBy==='self'?'מולא על ידי המועמד/ת':'מולא על ידי השדכנית'} · עודכן ${esc(fmtDate(c.updatedAt))}</div>
      </div></div>
    <div class="row"><button class="btn primary" data-act="edit" data-id="${id}">עריכת פרטים</button><button class="btn" data-act="matchfor" data-id="${id}">חיפוש התאמות</button><button class="btn danger" data-act="askdel" data-id="${id}">מחיקה</button></div>
    <div class="printbox"><button class="btn primary small" data-act="print" data-id="${id}">הפקת דף מועמד (PDF)</button>
      <label class="chk"><input type="checkbox" id="pr-phone">לכלול טלפון אישי</label>
      <label class="chk"><input type="checkbox" id="pr-refs" checked>לכלול אנשי קשר לבירורים</label></div>
    ${S.confirm==='del:'+id?`<div class="confirm">למחוק את ${esc(fullName(c))} מהמאגר לצמיתות? <button class="btn danger small" data-act="del" data-id="${id}">כן, למחוק</button><button class="btn small" data-act="cancel">ביטול</button></div>`:''}
  </div>
  ${c.notes?`<div class="panel"><h3>הערות השדכנית</h3><p style="white-space:pre-wrap;margin:8px 0 0">${esc(c.notes)}</p></div>`:''}
  ${parts}
  <div class="panel"><h3 style="margin-bottom:10px">הצעות</h3>${ps.length?ps.map(([,p])=>{const o=S.cands[p.m===id?p.f:p.m];return `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(fullName(o))} <span class="muted small">· ${esc(fmtDate(p.createdAt))}</span></span><span class="pill ${p.status}">${PST[p.status]}</span></div>`}).join(''):'<p class="muted" style="margin:0">עדיין לא הוצעו הצעות.</p>'}</div>`}

/* ---------- print card ---------- */
function printHtml(c,id,o){const a=age(c.birthDate),ph=S.photos[id];
  const sub=[msWord(c),a!=null?'גיל '+a:'',c.answers?.q_city,c.answers?.q_religious].filter(Boolean).map(esc).join(' · ');
  const body=PARTS.filter(p=>!p.office).map(p=>{const secs=p.sections.map(s=>{
      const rows=s.fields.filter(f=>!['text','gender','photo'].includes(f.type)).filter(f=>!(s.contact&&f.id==='phone'&&!o.phone)&&!(f.ref&&!o.refs)).map(f=>{const v=dispVal(f,c);return v?`<dt>${esc(f.label)}</dt><dd>${esc(v)}</dd>`:''}).join('');
      return rows?`<div class="pp-sec"><h3>${esc(s.title)}</h3><dl class="pp-dl">${rows}</dl></div>`:''}).join('');

  return `<div class="pp"><div class="pp-head">${ph?`<img class="pp-photo" src="${ph}" alt="">`:''}<div style="flex:1"><div class="pp-brand">פנקס השידוכים · כרטיס מועמד</div><h1>${esc(fullName(c))}</h1><div class="pp-sub">${sub}</div></div></div>
    ${body}<div class="pp-foot">הופק ב-${new Date().toLocaleDateString('he-IL')} · המידע נמסר לצורך בירור הצעת שידוך בלבד ואין להעבירו הלאה.</div></div>`}
async function printCard(id){const c=S.cands[id];if(!c)return;await ensurePhoto(id);

  $('#print').innerHTML=printHtml(c,id,o);
  const img=$('#print img');if(img&&!img.complete)await new Promise(r=>{img.onload=img.onerror=r});
  try{await document.fonts.ready}catch{}
  const t=document.title;document.title='כרטיס שידוך - '+fullName(c);

/* ---------- candidate form ---------- */
function fieldHtml(f,d){const n='a_'+f.id,v=f.base?null:(d.answers?.[f.id]??'');
  const lab=`<label${['gender','photo','agerange'].includes(f.type)||['single','multi'].includes(f.type)?'':` for="${f.base?'b-'+f.id:n}"`}>${esc(f.label)}${f.req?' <span class="req">*</span>':''}</label>${f.help?`<span class="help">${esc(f.help)}</span>`:''}`;
  const wide=['long','multi','single','photo','notes'].includes(f.type)?' wide':'';let inp='';
  switch(f.type){
    case'text':inp=`<input type="text" id="b-${f.id}" value="${esc(d[f.id])}">`;break;
    case'gender':inp=`<div class="choices" role="radiogroup"><label><input type="radio" name="b-gender" id="b-g-m" value="m" ${d.gender==='m'?'checked':''}>מועמד</label><label><input type="radio" name="b-gender" id="b-g-f" value="f" ${d.gender==='f'?'checked':''}>מועמדת</label></div>`;break;
    case'birth':{const a=age(d.birthDate);inp=`<input type="date" id="b-birthDate" value="${esc(d.birthDate)}"><span class="agechip" id="b-age" aria-live="polite">${a!=null?'גיל: '+a:''}</span>`;break}
    case'marital':inp=`<select id="b-maritalStatus">${Object.entries(MST).map(([k,v])=>`<option value="${k}" ${(d.maritalStatus||'single')===k?'selected':''}>${v[2]}</option>`).join('')}</select>`;break;
    case'kids':inp=`<input type="number" id="b-children" min="0" inputmode="numeric" value="${esc(d.children)}">`;break;
    case'photo':{const src=S.photoDraft!==undefined?S.photoDraft:(S.edit?S.photos[S.edit]:'');
      inp=`<div class="photobox">${src?`<img class="thumb" id="ph-prev" src="${src}" alt="תצוגה מקדימה">`:`<div class="thumb ph" id="ph-prev">אין תמונה</div>`}
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><label class="btn small" for="b-photo" style="font-weight:600">${src?'החלפת תמונה':'העלאת תמונה'}</label><input type="file" id="b-photo" accept="image/*" hidden>
        ${src?`<button type="button" class="btn link small" data-act="rmphoto" style="color:var(--bad)">הסרת התמונה</button>`:''}</div></div>`;break}
    case'agerange':inp=`<div class="row" style="flex-wrap:nowrap"><input type="number" id="b-ageMin" placeholder="מגיל" value="${esc(d.ageMin)}" aria-label="מגיל"><span>–</span><input type="number" id="b-ageMax" placeholder="עד גיל" value="${esc(d.ageMax)}" aria-label="עד גיל"></div>`;break;
    case'status':inp=`<select id="b-status">${Object.entries(CST).map(([k,x])=>`<option value="${k}" ${(d.status||'active')===k?'selected':''}>${x}</option>`).join('')}</select>`;break;
    case'filledby':inp=`<select id="b-filledBy"><option value="shadchanit" ${d.filledBy!=='self'?'selected':''}>השדכנית (לפי ראיון)</option><option value="self" ${d.filledBy==='self'?'selected':''}>המועמד/ת בעצמו/ה</option></select>`;break;
    case'notes':inp=`<textarea id="b-notes">${esc(d.notes)}</textarea>`;break;
    case'phone':inp=f.base?`<input type="tel" id="b-phone" dir="ltr" value="${esc(d.phone)}">`:`<input type="tel" id="${n}" name="${n}" dir="ltr" value="${esc(v)}">`;break;
    case'long':inp=`<textarea id="${n}" name="${n}">${esc(v)}</textarea>`;break;
    case'number':inp=`<input type="number" id="${n}" name="${n}" value="${esc(v)}" inputmode="numeric">`;break;
    case'select':inp=`<select id="${n}" name="${n}"><option value="">בחירה…</option>${f.options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case'single':inp=`<div class="choices" role="radiogroup">${f.options.map((o,i)=>`<label><input type="radio" name="${n}" id="${n}_${i}" value="${esc(o)}" ${v===o?'checked':''}>${esc(o)}</label>`).join('')}</div>`;break;
    case'multi':{const arr=Array.isArray(v)?v:[];inp=`<div class="choices">${f.options.map((o,i)=>`<label><input type="checkbox" name="${n}" id="${n}_${i}" value="${esc(o)}" ${arr.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;break}
    default:inp=`<input type="text" id="${n}" name="${n}" value="${esc(v)}">`}
  return `<div class="field${wide}" data-q="${f.id}"${f.id==='children'?' id="kids-wrap"':''}>${lab}${inp}<span class="errmsg">יש למלא שדה זה</span></div>`}
function viewForm(){const c=S.edit?S.cands[S.edit]:null;const d=c||{status:'active',filledBy:'shadchanit',maritalStatus:'single',answers:{}};
  return `<div class="row between"><h2>${c?'עריכת '+esc(fullName(c)):'מועמד/ת חדש/ה'}</h2>${c?`<button class="btn link" data-act="canceledit">ביטול</button>`:''}</div>
  <form class="form" id="cform" novalidate>
   ${PARTS.map(p=>`<section class="part${p.office?' office':''}"><div class="parthead">${p.tag?`<span class="tag">${p.tag}</span>`:''}<h2>${esc(p.title)}</h2></div>
     ${p.sections.map(s=>`<div class="fsec">${s.title?`<h3>${esc(s.title)}</h3>`:''}<div class="fgrid">${s.fields.map(f=>fieldHtml(f,d)).join('')}</div></div>`).join('')}</section>`).join('')}
   <div class="savebar"><button class="btn primary" type="submit" id="b-save">${c?'שמירת שינויים':'שמירת מועמד/ת'}</button><span class="muted small">שדות המסומנים ב-<span class="req">*</span> הם חובה</span></div>
  </form>`}
function updAge(){const el=$('#b-age');if(!el)return;const a=age($('#b-birthDate').value);el.textContent=a!=null?'גיל: '+a:''}
function updKids(){const w=$('#kids-wrap');if(w)w.hidden=$('#b-maritalStatus').value==='single'}
function afterForm(){const f=$('#cform');if(!f)return;updKids();
  f.addEventListener('input',e=>{if(e.target.id==='b-birthDate')updAge()});
  f.addEventListener('change',e=>{if(e.target.id==='b-birthDate')updAge();if(e.target.id==='b-maritalStatus')updKids();if(e.target.id==='b-photo')pickPhoto(e.target);const fd=e.target.closest('.field');if(fd)fd.classList.remove('err')});
  f.addEventListener('submit',e=>{e.preventDefault();saveCand()})}
function pickPhoto(inp){const file=inp.files&&inp.files[0];if(!file)return;
  if(!/^image\//.test(file.type)){toast('יש לבחור קובץ תמונה.',true);return}
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const max=800,sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    S.photoDraft=cv.toDataURL('image/jpeg',0.82);refreshPhotoField()};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('לא ניתן לקרוא את התמונה. נסו קובץ JPG או PNG.',true)};img.src=url}
function refreshPhotoField(){const w=document.querySelector('.field[data-q="photo"]');if(!w)return;const t=document.createElement('div');t.innerHTML=fieldHtml(ALLF.find(f=>f.id==='photo'),{});w.replaceWith(t.firstElementChild)}
async function saveCand(){const f=$('#cform');let bad=null;
  f.querySelectorAll('.field.err').forEach(e=>e.classList.remove('err'));
  const mark=id=>{const el=f.querySelector(`.field[data-q="${id}"]`);if(el){el.classList.add('err');bad=bad||el}};
  const num=id=>{const v=$(id).value;return v===''?null:+v};
  const ms=$('#b-maritalStatus').value;
  const base={firstName:$('#b-firstName').value.trim(),lastName:$('#b-lastName').value.trim(),gender:(f.querySelector('input[name="b-gender"]:checked')||{}).value||'',
    birthDate:$('#b-birthDate').value,maritalStatus:ms,children:ms!=='single'?num('#b-children'):null,phone:$('#b-phone').value.trim(),
    ageMin:num('#b-ageMin'),ageMax:num('#b-ageMax'),status:$('#b-status').value,filledBy:$('#b-filledBy').value,notes:$('#b-notes').value};
  for(const k of['firstName','lastName','gender','birthDate'])if(!base[k])mark(k);
  const answers={};
  for(const q of ALLF){if(q.base)continue;const n='a_'+q.id;let v;
    if(q.type==='multi')v=[...f.querySelectorAll(`input[name="${n}"]:checked`)].map(i=>i.value);
    else if(q.type==='single'){const c=f.querySelector(`input[name="${n}"]:checked`);v=c?c.value:''}
    else{v=f.querySelector(`[name="${n}"]`).value.trim();if(q.type==='number'&&v!=='')v=+v}
    if(q.req&&empty(v))mark(q.id);if(!empty(v))answers[q.id]=v}
  if(bad){bad.scrollIntoView({block:'center',behavior:'smooth'});toast('חסרים פרטים בשדות החובה',true);return}
  const row=toC({...base,answers});if(S.photoDraft!==undefined)row.photo=S.photoDraft;
  $('#b-save').disabled=true;const old=S.edit;
  const r=await write(()=>old?S.db.from('candidates').update(row).eq('id',old).select(COLS).single():S.db.from('candidates').insert(row).select(COLS).single(),old?'השינויים נשמרו':'המועמד/ת נוספ/ה למאגר');
  if(r&&r.id){S.cands[r.id]=fromC(r);if(S.photoDraft!==undefined)S.photos[r.id]=S.photoDraft||'';S.photoDraft=undefined;S.edit=null;S.tab='cands';S.sel=r.id;window.scrollTo(0,0);render()}
  else $('#b-save').disabled=false}

/* ---------- matching ---------- */
const val=(c,id)=>{if(id==='__marital')return MST[c?.maritalStatus||'single'][2];const v=c?.answers?.[id];return empty(v)?null:v};
const arr=v=>Array.isArray(v)?v:[v];
function scorePair(A,B){let pts=0,max=0,out=null;const why=[];
  const aA=age(A.birthDate),aB=age(B.birthDate);
  if(aB!=null&&((A.ageMin&&aB<A.ageMin)||(A.ageMax&&aB>A.ageMax)))out=`גיל ${aB} מחוץ לטווח שביקש/ה ${fullName(A)}`;
  else if(aA!=null&&((B.ageMin&&aA<B.ageMin)||(B.ageMax&&aA>B.ageMax)))out=`גיל ${aA} מחוץ לטווח שביקש/ה ${fullName(B)}`;
  for(const q of ALLF){if(!q.match)continue;const w=q.match.weight||1;
    for(const[X,Y]of[[A,B],[B,A]]){const p=val(X,q.id),act=val(Y,q.match.target);if(p==null||act==null)continue;
      const ok=arr(act).some(x=>arr(p).includes(x));max+=w;if(ok)pts+=w;why.push({ok,t:`${q.label.replace(' מבוקשת','').replace(' מבוקש','')} (לפי ${X.firstName||''})`})}}
  return {score:max?Math.round(pts/max*100):null,why,out,ageDiff:aA!=null&&aB!=null?Math.abs(aA-aB):99}}
function viewMatch(){const cs=Object.entries(S.cands).sort((a,b)=>fullName(a[1]).localeCompare(fullName(b[1]),'he'));
  if(!cs.length)return `<h2>הצלבה</h2><div class="empty"><h3>אין עדיין מועמדים להצלבה</h3><p>אחרי שיתווספו מועמדים, כאן בוחרים מועמד/ת ומקבלים רשימת התאמות מדורגת.</p><button class="btn primary" data-act="new">הוספת מועמד</button></div>`;
  let res='';const A=S.cands[S.matchFor];
  if(A){const taken=new Set(Object.values(S.props).map(p=>p.m+'|'+p.f));
    const key=id=>A.gender==='m'?S.matchFor+'|'+id:id+'|'+S.matchFor;
    let rows=cs.filter(([id,c])=>id!==S.matchFor&&c.gender&&c.gender!==A.gender&&(!S.onlyActive||['active','inprop'].includes(c.status))&&(!S.matchMs||(S.matchMs==='single'?(c.maritalStatus||'single')==='single':(c.maritalStatus||'single')!=='single')))
      .map(([id,c])=>({id,c,r:scorePair(A,c),prop:taken.has(key(id))}));
    rows.sort((x,y)=>(!!x.r.out-!!y.r.out)||((y.r.score??-1)-(x.r.score??-1))||(x.r.ageDiff-y.r.ageDiff));
    const inn=rows.filter(r=>!r.r.out),outs=rows.filter(r=>r.r.out);
    const item=({id,c,r,prop})=>{const a=age(c.birthDate),h=highlights(c);return `<div class="mitem${r.out?' out':''}">
      <div class="score">${r.score==null?'—':r.score+'%'}<small>התאמה</small></div>
      <div style="min-width:0"><div><b style="font-family:var(--display);font-size:1.1rem">${esc(fullName(c))}</b> <span class="muted small">· ${msWord(c)}${c.children&&c.maritalStatus!=='single'?' ('+c.children+' ילדים)':''}${a!=null?' · גיל '+a:''}${h?' · '+h:''}</span></div>
        ${r.out?`<div class="small" style="color:var(--bad)">${esc(r.out)}</div>`:''}
        ${r.why.length?`<div class="why">${r.why.map(w=>`<span class="${w.ok?'y':'n'}">${w.ok?'✓':'✗'} ${esc(w.t)}</span>`).join('')}</div>`:''}</div>
      <div class="act row">${prop?'<span class="pill">כבר הוצע</span>':`<button class="btn primary small" data-act="propose" data-id="${id}">יצירת הצעה</button>`}<button class="btn small" data-act="open" data-id="${id}">כרטיס</button></div></div>`};
    res=`<p class="muted" style="margin:0">${inn.length} התאמות אפשריות ל${esc(fullName(A))}${outs.length?`, ו-${outs.length} שנפסלו בגלל טווח הגילאים`:''}. הדירוג מבוסס על גיל, רמה דתית מבוקשת ומצב משפחתי מבוקש, בשני הכיוונים.</p>
      <div class="mlist">${inn.map(item).join('')||'<div class="empty"><p>לא נמצאו התאמות העומדות בכל התנאים.</p></div>'}</div>
      ${outs.length?`<button class="btn link" data-act="toggleout">${S.showOut?'הסתרת':'הצגת'} המועמדים שנפסלו (${outs.length})</button>${S.showOut?`<div class="mlist">${outs.map(item).join('')}</div>`:''}`:''}`}
  const opt=(g)=>cs.filter(([,c])=>c.gender===g).map(([id,c])=>`<option value="${id}" ${S.matchFor===id?'selected':''}>${esc(fullName(c))}${c.status==='engaged'?' (מאורס/ת)':''}</option>`).join('');
  return `<h2>הצלבה</h2>
  <div class="panel row"><div class="grow"><label for="m-for">חיפוש התאמות עבור</label><select id="m-for"><option value="">בחירת מועמד/ת…</option><optgroup label="מועמדים">${opt('m')}</optgroup><optgroup label="מועמדות">${opt('f')}</optgroup></select></div>
    <div><label for="m-ms">מצב משפחתי</label><select id="m-ms"><option value="">הכול</option><option value="single" ${S.matchMs==='single'?'selected':''}>רווקים ורווקות בלבד</option><option value="prev" ${S.matchMs==='prev'?'selected':''}>גרושים ואלמנים בלבד</option></select></div>
    <label class="chk"><input type="checkbox" id="m-active" ${S.onlyActive?'checked':''}>רק מועמדים פעילים ובהצעה</label></div>${res}`}

/* ---------- proposals ---------- */
function viewProps(){const ps=Object.entries(S.props);
  if(!ps.length)return `<h2>הצעות</h2><div class="empty"><h3>עדיין אין הצעות</h3><p>הצעה נוצרת מלשונית ההצלבה בלחיצה על "יצירת הצעה". כאן עוקבים אחריה משלב ההצעה ועד מזל טוב.</p><button class="btn primary" data-tab="match">מעבר להצלבה</button></div>`;
  ps.sort((a,b)=>(b[1].updatedAt||'').localeCompare(a[1].updatedAt||''));
  return `<h2>הצעות</h2><div class="pcols">${Object.entries(PST).map(([k,v])=>{const list=ps.filter(([,p])=>p.status===k);
    return `<div class="pcol"><h3>${v} <span>${list.length}</span></h3>${list.map(([pid,p])=>`<div class="prop">
      <div class="pair"><button class="btn link" data-act="open" data-id="${p.m}" style="padding:0;font:inherit">${esc(fullName(S.cands[p.m]))}</button> ו<button class="btn link" data-act="open" data-id="${p.f}" style="padding:0;font:inherit">${esc(fullName(S.cands[p.f]))}</button></div>
      <div class="muted small">נפתחה ${esc(fmtDate(p.createdAt))}${p.updatedAt&&p.updatedAt!==p.createdAt?' · עודכנה '+esc(fmtDate(p.updatedAt)):''}</div>
      <select data-pst="${pid}" aria-label="שלב ההצעה">${Object.entries(PST).map(([kk,vv])=>`<option value="${kk}" ${kk===p.status?'selected':''}>${vv}</option>`).join('')}</select>
      <textarea data-pnote="${pid}" id="pn-${pid}" placeholder="הערות: מה נבדק, מי התקשר, מה הלאה">${esc(p.notes)}</textarea>
      ${S.confirm==='pdel:'+pid?`<div class="confirm small">למחוק את ההצעה? <button class="btn danger small" data-act="pdel" data-id="${pid}">מחיקה</button><button class="btn small" data-act="cancel">ביטול</button></div>`:`<button class="btn link small" data-act="askpdel" data-id="${pid}" style="align-self:flex-start">מחיקת ההצעה</button>`}
    </div>`).join('')||'<p class="muted small" style="margin:0">אין הצעות בשלב זה</p>'}</div>`}).join('')}</div>`}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const tb=e.target.closest('[data-tab]');if(tb){if(tb.dataset.tab==='form'){S.edit=null;S.photoDraft=undefined}setTab(tb.dataset.tab);return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act,id=b.dataset.id;
  switch(act){
    case'logout':await S.db.auth.signOut();location.reload();break;
    case'new':S.edit=null;S.photoDraft=undefined;setTab('form');break;
    case'open':S.tab='cands';S.sel=id;S.confirm=null;window.scrollTo(0,0);render();break;
    case'back':S.sel=null;S.confirm=null;render();break;
    case'edit':S.edit=id;S.photoDraft=undefined;await ensurePhoto(id);S.tab='form';window.scrollTo(0,0);render();break;
    case'canceledit':S.sel=S.edit;S.edit=null;S.photoDraft=undefined;S.tab='cands';render();break;
    case'rmphoto':S.photoDraft=null;refreshPhotoField();break;
    case'print':printCard(id);break;
    case'matchfor':S.matchFor=id;setTab('match');break;
    case'askdel':S.confirm='del:'+id;render();break;
    case'askpdel':S.confirm='pdel:'+id;render();break;
    case'cancel':S.confirm=null;render();break;
    case'del':if(await write(()=>S.db.from('candidates').delete().eq('id',id),'המועמד/ת נמחק/ה')){delete S.cands[id];S.sel=null;S.confirm=null;render()}break;
    case'pdel':if(await write(()=>S.db.from('proposals').delete().eq('id',id),'ההצעה נמחקה')){delete S.props[id];S.confirm=null;render()}break;
    case'toggleout':S.showOut=!S.showOut;render();break;
    case'propose':{const A=S.cands[S.matchFor];const m=A.gender==='m'?S.matchFor:id,f=A.gender==='m'?id:S.matchFor;b.disabled=true;
      const r=await write(()=>S.db.from('proposals').insert({male_id:m,female_id:f,status:'proposed',notes:'',history:[{status:'proposed',at:now()}]}).select().single(),'ההצעה נוצרה. אפשר לעקוב אחריה בלשונית "הצעות".');
      if(r&&r.id){S.props[r.id]=fromP(r);render()}else b.disabled=false;break}
  }});
document.addEventListener('input',e=>{if(e.target.id==='f-q'){S.f.q=e.target.value;renderList()}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.id==='f-g'){S.f.g=el.value;renderList();return}if(el.id==='f-st'){S.f.st=el.value;renderList();return}if(el.id==='f-ms'){S.f.ms=el.value;renderList();return}
  if(el.id==='m-for'){S.matchFor=el.value;S.showOut=false;render();return}if(el.id==='m-active'){S.onlyActive=el.checked;render();return}if(el.id==='m-ms'){S.matchMs=el.value;render();return}
  if(el.dataset.pst){const pid=el.dataset.pst,p=S.props[pid],st=el.value;const hist=[...(p.history||[]),{status:st,at:now()}];
    if(await write(()=>S.db.from('proposals').update({status:st,history:hist}).eq('id',pid),'השלב עודכן')){p.status=st;p.history=hist;p.updatedAt=now();
      if(st==='mazal'){for(const cid of[p.m,p.f])if(S.cands[cid]){await write(()=>S.db.from('candidates').update({status:'engaged'}).eq('id',cid));S.cands[cid].status='engaged'}toast('מזל טוב! שני המועמדים סומנו כמאורסים.')}
      render()}return}
  if(el.dataset.pnote){const pid=el.dataset.pnote;if(S.props[pid]&&S.props[pid].notes!==el.value){const v=el.value;if(await write(()=>S.db.from('proposals').update({notes:v}).eq('id',pid),'ההערה נשמרה'))S.props[pid].notes=v}}
});

/* ---------- boot ---------- */
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){sb=null}
const quiet=()=>S.tab==='form'||document.activeElement?.dataset?.pnote;
async function loadAll(){
  const[c,p]=await Promise.all([sb.from('candidates').select(COLS),sb.from('proposals').select('*')]);
  if(c.error||p.error){console.error(c.error||p.error);toast('טעינת הנתונים נכשלה. בדקו את החיבור לאינטרנט ורעננו.',true);return}
  const cs={};c.data.forEach(r=>cs[r.id]=fromC(r));S.cands=cs;
  const ps={};p.data.forEach(r=>ps[r.id]=fromP(r));S.props=ps}
let reloadT=null;
function scheduleReload(){clearTimeout(reloadT);reloadT=setTimeout(async()=>{S.photos={};await loadAll();renderStats();if(!quiet())render()},500)}
function showLogin(msg){$('#app').hidden=true;$('#login').hidden=false;$('#lerr').textContent=msg||'';$('#l-btn').disabled=false}
async function enter(session){
  const {data,error}=await sb.from('staff').select('role').eq('user_id',session.user.id).maybeSingle();
  if(error||!data){await sb.auth.signOut();showLogin(error?'לא ניתן להתחבר כרגע. נסו שוב.':'החשבון הזה אינו מורשה במערכת. פני למנהלת המשרד.');return}
  S.db=sb;
  $('#who').innerHTML=`<span dir="ltr">${esc(session.user.email)}</span><span>·</span><span>${data.role==='admin'?'מנהלת':'שדכנית'}</span><button class="btn small" data-act="logout">יציאה</button>`;
  $('#login').hidden=true;$('#app').hidden=false;render();
  await loadAll();S.ready=true;render();
  sb.channel('changes').on('postgres_changes',{event:'*',schema:'public',table:'candidates'},scheduleReload).on('postgres_changes',{event:'*',schema:'public',table:'proposals'},scheduleReload).subscribe();
}
async function boot(){
  if(!sb){document.body.innerHTML='<p style="padding:24px;font-family:sans-serif" dir="rtl">לא ניתן לטעון את המערכת. בדקו את החיבור לאינטרנט ורעננו את הדף.</p>';return}
  $('#lform').addEventListener('submit',async e=>{e.preventDefault();const em=$('#l-email').value.trim(),pw=$('#l-pass').value;
    if(!em||!pw){$('#lerr').textContent='יש למלא מייל וסיסמה.';return}
    $('#l-btn').disabled=true;$('#lerr').textContent='';
    const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){showLogin(/fetch|network/i.test(error.message)?'אין חיבור לאינטרנט.':'המייל או הסיסמה אינם נכונים.');return}
    enter(data.session)});
  const {data}=await sb.auth.getSession();
  if(data&&data.session)enter(data.session);else showLogin();
}
boot();
</script>
</body>
